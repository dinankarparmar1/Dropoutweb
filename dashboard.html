<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Dropout Traders</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
max-width:1400px;
margin:40px auto;
padding:20px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title{
font-size:32px;
font-weight:700;
}

.newBtn{
padding:14px 24px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;
background:var(--gold);
color:#111;
}

table{
width:100%;
border-collapse:collapse;
}

thead{
background:rgba(212,175,55,.12);
}

th,td{
padding:18px;
text-align:left;
border-bottom:1px solid rgba(212,175,55,.15);
}

.action{
display:flex;
gap:10px;
}

.edit{
background:#4a9a76;
color:#fff;
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
}

.delete{
background:#b1594a;
color:#fff;
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
}

.card{
background:var(--panel);
border:1px solid var(--panel-border);
border-radius:20px;
padding:20px;
overflow:auto;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<div class="title">Published Analysis</div>

<button class="newBtn"
onclick="location.href='admin.html'">

+ New Analysis

</button>
</div>

<div class="card">

<table>

<thead>

<tr>

<th>Stock</th>

<th>Signal</th>

<th>Date</th>

<th>Views</th>

<th>Action</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>

</html>
