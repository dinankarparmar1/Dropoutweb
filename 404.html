  <style>
    :root { color-scheme: dark; --gold:#d4af37; --gold2:#f1d77c; --muted:#aaa9a4; --line:rgba(212,175,55,.28); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px;
      background: radial-gradient(ellipse at 50% 0%, rgba(212,175,55,.12), transparent 50%), #08090c;
      color:#f7f5ef; font:15px/1.7 Inter, Arial, sans-serif; text-align:center; }
    .box { max-width:520px; }
    .brand { font:700 14px 'Space Mono', monospace; letter-spacing:.14em; }
    .brand b { color:var(--gold); }
    .code { margin:34px 0 4px; font:600 clamp(96px, 22vw, 150px)/1 'Playfair Display', Georgia, serif;
      background:linear-gradient(180deg,#fff 10%,var(--gold2) 55%,#8a6d1f 120%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    h1 { font:600 clamp(26px, 5vw, 34px) 'Playfair Display', Georgia, serif; margin:6px 0 10px; }
    h1 span { color:var(--gold2); font-style:italic; }
    p { color:var(--muted); margin:0 0 30px; }
    .btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { padding:13px 24px; border-radius:99px; font-weight:600; font-size:14px; text-decoration:none; }
    .gold { background:linear-gradient(135deg,#f3d576,var(--gold) 55%,#8a6d1f); color:#1a1305; }
    .ghost { border:1px solid var(--line); color:var(--gold2); }
  </style>
