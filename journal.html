<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal — Dropout Traders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08;
    --panel:rgba(255,248,235,0.025);
    --panel-hi:rgba(255,248,235,0.045);
    --line:rgba(224,197,138,0.14);
    --line-hi:rgba(224,197,138,0.4);
    --brass:#c9a227;
    --brass-bright:#ecc766;
    --brass-deep:#7a6118;
    --ink:#f2ede1;
    --sub:#a8a08c;
    --sub-dim:#5f5a4d;
    --emerald:#5da583;
    --terracotta:#c17a5f;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(ellipse 800px 500px at 20% -5%, rgba(201,162,39,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 20%, rgba(93,165,131,0.04), transparent 60%),
      var(--bg);
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px;}

  @keyframes riseIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .reveal{animation:riseIn .7s cubic-bezier(.19,.7,.3,1) both;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:28px 0 30px;}
  .brand{font-family:var(--serif);font-weight:600;font-size:19px;display:flex;align-items:baseline;gap:8px;}
  .brand .thin{color:var(--sub-dim);font-weight:500;font-size:14px;}
  .brand .rule{width:24px;height:1px;background:var(--brass);display:inline-block;}
  .back-link{font-family:var(--mono);font-size:11px;color:var(--sub-dim);letter-spacing:0.05em;text-decoration:none;}
  .mascot-orb{
    width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass-deep));
    box-shadow:0 0 12px rgba(201,162,39,0.4);
    position:relative;transition:background 1s ease, box-shadow 1s ease;flex-shrink:0;
  }
  .mascot-orb::after{
    content:'';position:absolute;inset:-3px;border-radius:50%;
    border:1px solid rgba(236,199,102,0.35);
    animation:orbBreathe 3.2s ease-in-out infinite;transition:border-color 1s ease;
  }
  .mascot-orb.mood-caution{background:radial-gradient(circle at 35% 30%, #f2b25a, #8a5a1f);box-shadow:0 0 14px rgba(217,143,58,0.55);}
  .mascot-orb.mood-caution::after{border-color:rgba(242,178,90,0.45);animation-duration:2.4s;}
  .mascot-orb.mood-alert{background:radial-gradient(circle at 35% 30%, #e08a78, #8a3b2c);box-shadow:0 0 16px rgba(193,87,74,0.65);}
  .mascot-orb.mood-alert::after{border-color:rgba(224,138,120,0.55);animation-duration:1.4s;}
  @keyframes orbBreathe{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.12);opacity:.9;}}

  .page-head{margin-bottom:22px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:10px;color:var(--sub-dim);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:8px;}
  .page-head h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;}

  /* streak strip */
  .streak-strip{
    display:flex;align-items:center;gap:24px;
    border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(160deg, var(--panel-hi), var(--panel));
    padding:16px 24px;margin-bottom:20px;flex-wrap:wrap;
  }
  .streak-item{display:flex;flex-direction:column;gap:3px;}
  .streak-item .num{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--brass-bright);}
  .streak-item .lbl{font-family:var(--mono);font-size:9.5px;color:var(--sub-dim);letter-spacing:0.08em;text-transform:uppercase;}
  .streak-divider{width:1px;height:32px;background:var(--line);}

  /* new entry button */
  .new-entry-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .new-entry-bar h2{font-family:var(--mono);font-size:10.5px;letter-spacing:0.16em;color:var(--sub-dim);text-transform:uppercase;margin:0;}
  .coach-banner{
    border:1px solid rgba(193,122,95,0.4);border-radius:16px;
    background:linear-gradient(160deg, rgba(193,122,95,0.1), rgba(193,122,95,0.03));
    padding:16px 20px;margin-bottom:16px;display:none;
  }
  .coach-banner.show{display:block;}
  .coach-banner .cb-head{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--terracotta);
  }
  .coach-banner .cb-item{
    font-size:13.5px;line-height:1.55;color:var(--ink);padding:8px 0;
    border-top:1px solid rgba(193,122,95,0.15);
  }
  .coach-banner .cb-item:first-of-type{border-top:none;}
  .btn-new{
    font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
    background:transparent;border:1px solid var(--brass-deep);color:var(--brass-bright);
    padding:9px 18px;border-radius:20px;cursor:pointer;transition:all .25s ease;
  }
  .btn-new:hover{background:rgba(201,162,39,0.1);border-color:var(--brass-bright);}

  /* new entry form panel */
  .entry-form{
    border:1px solid var(--line-hi);border-radius:var(--radius);
    background:linear-gradient(160deg, var(--panel-hi), var(--panel));
    padding:24px 26px;margin-bottom:22px;
    display:none;
  }
  .entry-form.open{display:block;}
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .form-grid.wide{grid-template-columns:repeat(2,1fr);}
  @media(max-width:640px){.form-grid,.form-grid.wide{grid-template-columns:1fr 1fr;}}
  .field label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--sub-dim);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:9px 11px;
  }
  .field textarea{resize:vertical;min-height:52px;font-family:var(--sans);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brass);}
  .field.required label::after{content:' *';color:var(--terracotta);}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;}
  .btn-save{
    font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
    background:var(--brass);border:none;color:#0b0a08;font-weight:600;
    padding:10px 22px;border-radius:20px;cursor:pointer;
  }
  .btn-cancel{
    font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--sub);
    padding:10px 18px;border-radius:20px;cursor:pointer;
  }

  /* ledger table */
  .section-title{font-family:var(--mono);font-size:10.5px;letter-spacing:0.16em;color:var(--sub-dim);text-transform:uppercase;margin:0 0 4px;padding:0 4px;}
  .ledger{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(160deg, var(--panel-hi), var(--panel));overflow:hidden;margin-bottom:24px;}
  .ledger-head{
    display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 2.2fr 0.6fr;
    padding:12px 22px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:9.5px;letter-spacing:0.08em;color:var(--sub-dim);text-transform:uppercase;
  }
  .ledger-row{
    display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 2.2fr 0.6fr;
    padding:15px 22px;border-bottom:1px solid var(--line);align-items:center;
    transition:background .2s ease;
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row:hover{background:rgba(255,255,255,0.015);}
  .cell-instrument{font-size:13.5px;color:var(--ink);}
  .cell-instrument .dir{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;margin-left:8px;letter-spacing:0.04em;}
  .dir.long{background:rgba(93,165,131,0.12);color:var(--emerald);}
  .dir.short{background:rgba(193,122,95,0.12);color:var(--terracotta);}
  .cell-num{font-family:var(--serif);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .cell-pnl{font-family:var(--serif);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;}
  .cell-pnl.pos{color:var(--emerald);}
  .cell-pnl.neg{color:var(--terracotta);}
  .cell-note{font-size:12.5px;color:var(--sub);line-height:1.4;font-style:italic;}
  .cell-note.reflection{color:var(--terracotta);opacity:0.85;}
  .cell-date{font-family:var(--mono);font-size:10.5px;color:var(--sub-dim);}

  @media(max-width:800px){
    .ledger-head{display:none;}
    .ledger-row{grid-template-columns:1fr;gap:6px;padding:16px 20px;}
    .cell-num::before{content:attr(data-label) ': ';color:var(--sub-dim);font-family:var(--mono);font-size:9px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar reveal">
    <div class="brand">Trader<span class="rule"></span><span class="thin">OS</span></div>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="dashboard.html" class="back-link">← Dashboard</a>
      <a href="coach.html" class="back-link">Full Analysis →</a>
      <div class="mascot-orb" id="mascotOrb" title="Ivaan — calm & steady"></div>
      <button id="btnSignOut" style="background:transparent;border:1px solid var(--line);color:var(--sub-dim);font-family:var(--mono);font-size:10px;letter-spacing:0.05em;padding:6px 12px;border-radius:20px;cursor:pointer;">Sign Out</button>
    </div>
  </div>

  <div class="page-head reveal" style="animation-delay:.03s">
    <div class="eyebrow">Trading Journal</div>
    <h1>Your Trading Ledger</h1>
  </div>

  <div class="streak-strip reveal" style="animation-delay:.06s">
    <div class="streak-item"><div class="num" id="statStreak">–</div><div class="lbl">Disciplined streak</div></div>
    <div class="streak-divider"></div>
    <div class="streak-item"><div class="num" id="statMonthCount">–</div><div class="lbl">Entries this month</div></div>
    <div class="streak-divider"></div>
    <div class="streak-item"><div class="num" id="statReflectedPct">–</div><div class="lbl">Losses reflected on</div></div>
  </div>

  <div class="coach-banner" id="coachBanner">
    <div class="cb-head">🤖 Ivaan — Coach Alert</div>
    <div id="coachItems"></div>
  </div>

  <div class="new-entry-bar reveal" style="animation-delay:.09s">
    <h2>Recent Entries</h2>
    <button class="btn-new" onclick="document.getElementById('entryForm').classList.toggle('open')">+ Log a Trade</button>
  </div>

  <div class="entry-form reveal" id="entryForm">
    <div class="form-grid">
      <div class="field required"><label>Instrument</label><input type="text" id="f-instrument" placeholder="e.g. NIFTY 24800 CE"></div>
      <div class="field required"><label>Direction</label>
        <select id="f-direction"><option value="Long">Long</option><option value="Short">Short</option></select>
      </div>
      <div class="field required"><label>Size / Qty</label><input type="text" id="f-size" placeholder="e.g. 2 lots"></div>
      <div class="field required"><label>Risk %</label><input type="text" id="f-risk" placeholder="e.g. 0.5"></div>
    </div>
    <div class="form-grid">
      <div class="field required"><label>Entry Price</label><input type="text" id="f-entry" placeholder="0.00"></div>
      <div class="field required"><label>Exit Price</label><input type="text" id="f-exit" placeholder="0.00"></div>
      <div class="field"><label>P&L</label><input type="text" id="f-pnl" placeholder="e.g. 5100 or -3500"></div>
      <div class="field"><label>Date</label><input type="date" id="f-date"></div>
    </div>
    <div class="form-grid wide">
      <div class="field required"><label>Why this trade? (feeds your AI Coach)</label><textarea id="f-note" placeholder="What was your setup, thesis, or signal?"></textarea></div>
      <div class="field"><label>Reflection (required on losses)</label><textarea id="f-reflection" placeholder="What actually happened? What would you do differently?"></textarea></div>
    </div>
    <div class="form-actions">
      <div id="formError" style="color:var(--terracotta);font-family:var(--mono);font-size:11.5px;margin-right:auto;align-self:center;"></div>
      <button class="btn-cancel" onclick="document.getElementById('entryForm').classList.remove('open')">Cancel</button>
      <button class="btn-save" id="btnSave">Save Entry</button>
    </div>
  </div>

  <div class="ledger reveal" style="animation-delay:.12s">
    <div class="ledger-head">
      <div>Instrument</div><div>Entry</div><div>Exit</div><div>Risk</div><div>P&L</div><div>Note</div><div>Date</div>
    </div>
    <div id="ledgerBody">
      <div class="ledger-row"><div class="cell-note" style="grid-column:1/-1;">Loading your entries...</div></div>
    </div>
  </div>

</div>

<script>
const WORKER_URL = 'https://ivaan.dinankarparmar12345.workers.dev';

// ── Auth: must be signed in to see this page ──────────────────────────────
const authToken = localStorage.getItem('dt_auth_token');
if (!authToken) {
  window.location.href = 'auth.html?redirect=journal.html';
}
document.getElementById('btnSignOut').addEventListener('click', async () => {
  try {
    await fetch(`${WORKER_URL}/auth/logout`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken } });
  } catch {}
  localStorage.removeItem('dt_auth_token');
  localStorage.removeItem('dt_user_email');
  window.location.href = 'auth.html';
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function formatDate(sqliteUtc){
  // SQLite's datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC, no "Z" suffix
  const d = new Date(sqliteUtc.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
}

function renderEntries(entries){
  const body = document.getElementById('ledgerBody');
  if (!entries.length){
    body.innerHTML = '<div class="ledger-row"><div class="cell-note" style="grid-column:1/-1;">No entries yet — log your first trade above.</div></div>';
  } else {
    body.innerHTML = entries.map(e => {
      const dir = (e.direction || '').toLowerCase() === 'short' ? 'short' : 'long';
      const pnlClass = e.pnl == null ? '' : (e.pnl >= 0 ? 'pos' : 'neg');
      const pnlText = e.pnl == null ? '—' : (e.pnl >= 0 ? '+' : '−') + '₹' + Math.abs(e.pnl).toLocaleString('en-IN');
      const isLoss = e.pnl != null && e.pnl < 0;
      const hasReflection = e.reflection && e.reflection.trim().length > 0;
      const noteText = isLoss && hasReflection ? e.reflection : (e.note || '—');
      const noteClass = isLoss ? ' reflection' : '';
      return `<div class="ledger-row">
        <div class="cell-instrument">${escapeHtml(e.instrument)} <span class="dir ${dir}">${dir.toUpperCase()}</span></div>
        <div class="cell-num" data-label="Entry">${e.entry_price ?? '—'}</div>
        <div class="cell-num" data-label="Exit">${e.exit_price ?? '—'}</div>
        <div class="cell-num" data-label="Risk">${e.risk_pct != null ? e.risk_pct + '%' : '—'}</div>
        <div class="cell-pnl ${pnlClass}" data-label="P&L">${pnlText}</div>
        <div class="cell-note${noteClass}">${escapeHtml(noteText)}</div>
        <div class="cell-date">${formatDate(e.created_at)}</div>
      </div>`;
    }).join('');
  }

  // Streak strip — computed client-side from the same entries just fetched.
  const now = Date.now();
  const THIRTY_DAYS = 30*24*60*60*1000;
  const monthCount = entries.filter(e => {
    const t = Date.parse(e.created_at.replace(' ', 'T') + 'Z');
    return !isNaN(t) && now - t <= THIRTY_DAYS;
  }).length;

  const losses = entries.filter(e => e.pnl != null && e.pnl < 0);
  const reflectedLosses = losses.filter(e => e.reflection && e.reflection.trim().length > 0);
  const reflectedPct = losses.length ? Math.round((reflectedLosses.length / losses.length) * 100) : 100;

  // Disciplined streak: consecutive most-recent entries (newest first) that
  // are either a win, or a loss with a reflection filled in.
  let streak = 0;
  for (const e of entries) {
    const disciplined = e.pnl == null || e.pnl >= 0 || (e.reflection && e.reflection.trim().length > 0);
    if (disciplined) streak++; else break;
  }

  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statMonthCount').textContent = monthCount;
  document.getElementById('statReflectedPct').textContent = reflectedPct + '%';
}

async function loadCoach(){
  const banner = document.getElementById('coachBanner');
  const itemsEl = document.getElementById('coachItems');
  const orb = document.getElementById('mascotOrb');
  try {
    const res = await fetch(`${WORKER_URL}/journal/coach`, { headers: { 'Authorization': 'Bearer ' + authToken } });
    if (!res.ok) { banner.classList.remove('show'); return; }
    const data = await res.json();
    const warnings = data.warnings || [];

    // Reactive mascot mood — same real signal as the banner below, not a
    // separate guess. High severity beats medium.
    orb.classList.remove('mood-caution', 'mood-alert');
    const hasHigh = warnings.some(w => w.severity === 'high');
    if (hasHigh) {
      orb.classList.add('mood-alert');
      orb.title = 'Ivaan — alert, review your last trades';
    } else if (warnings.length > 0) {
      orb.classList.add('mood-caution');
      orb.title = 'Ivaan — watch this pattern';
    } else {
      orb.title = 'Ivaan — calm & steady';
    }

    if (warnings.length === 0) {
      banner.classList.remove('show');
      return;
    }
    itemsEl.innerHTML = warnings.map(w => `<div class="cb-item">${escapeHtml(w.message)}</div>`).join('');
    banner.classList.add('show');
  } catch {
    banner.classList.remove('show');
  }
}

async function loadEntries(){
  try {
    const res = await fetch(`${WORKER_URL}/journal/list`, { headers: { 'Authorization': 'Bearer ' + authToken } });
    if (res.status === 401) {
      localStorage.removeItem('dt_auth_token');
      localStorage.removeItem('dt_user_email');
      window.location.href = 'auth.html?redirect=journal.html';
      return;
    }
    const data = await res.json();
    renderEntries(data.entries || []);
  } catch {
    document.getElementById('ledgerBody').innerHTML = '<div class="ledger-row"><div class="cell-note" style="grid-column:1/-1;">Could not load entries — try reloading the page.</div></div>';
  }
}

document.getElementById('btnSave').addEventListener('click', async () => {
  const errorEl = document.getElementById('formError');
  errorEl.textContent = '';

  const instrument = document.getElementById('f-instrument').value.trim();
  const direction = document.getElementById('f-direction').value;
  const size = document.getElementById('f-size').value.trim();
  const riskRaw = document.getElementById('f-risk').value.trim();
  const entryRaw = document.getElementById('f-entry').value.trim();
  const exitRaw = document.getElementById('f-exit').value.trim();
  const pnlRaw = document.getElementById('f-pnl').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const reflection = document.getElementById('f-reflection').value.trim();

  if (!instrument) { errorEl.textContent = 'Instrument is required.'; return; }
  if (!note) { errorEl.textContent = 'Add a reason for the trade — this is what feeds your AI Coach later.'; return; }

  const pnl = pnlRaw === '' ? null : Number(pnlRaw);
  if (pnl !== null && pnl < 0 && !reflection) {
    errorEl.textContent = 'This trade lost money — add a reflection before saving.';
    return;
  }

  const payload = {
    instrument,
    direction,
    size: size || null,
    risk_pct: riskRaw === '' ? null : Number(riskRaw),
    entry_price: entryRaw === '' ? null : Number(entryRaw),
    exit_price: exitRaw === '' ? null : Number(exitRaw),
    pnl,
    note,
    reflection: reflection || null,
  };

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(`${WORKER_URL}/journal/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) {
      localStorage.removeItem('dt_auth_token');
      localStorage.removeItem('dt_user_email');
      window.location.href = 'auth.html?redirect=journal.html';
      return;
    }
    const result = await res.json();
    if (!res.ok || result.error) {
      errorEl.textContent = result.error || 'Could not save — try again.';
    } else {
      document.getElementById('entryForm').classList.remove('open');
      ['f-instrument','f-size','f-risk','f-entry','f-exit','f-pnl','f-note','f-reflection'].forEach(id => {
        document.getElementById(id).value = '';
      });
      await loadEntries();
      await loadCoach();
    }
  } catch {
    errorEl.textContent = 'Network error — try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Entry';
  }
});

loadEntries();
loadCoach();
</script>
</body>
</html>
