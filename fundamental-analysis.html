<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamental Analysis | DropoutWeb</title>

<link rel="stylesheet" href="css/fundamental.css">
</head>

<body>

<header class="header">
    <div class="container">
        <h1>Fundamental Analysis</h1>
        <p>AI Powered Stock Research</p>
    </div>
</header>

<section class="search-section">
    <div class="container">

        <input
            type="text"
            id="stockSearch"
            placeholder="Search NSE Stock (Example: RELIANCE)"
        >

        <button id="searchBtn">
            Analyze Stock
        </button>

    </div>
</section>

<section class="score-section">

<div class="container">

<div class="score-card">

<h2>AI SCORE</h2>

<div id="score">--</div>

<div id="signal">
Waiting...
</div>

</div>

</div>

</section>

<section class="metrics">

<div class="container">

<div class="metric-card">
<h3>Financial Health</h3>
<p id="health">--</p>
</div>

<div class="metric-card">
<h3>Growth</h3>
<p id="growth">--</p>
</div>

<div class="metric-card">
<h3>Valuation</h3>
<p id="valuation">--</p>
</div>

<div class="metric-card">
<h3>Risk</h3>
<p id="risk">--</p>
</div>

<div class="metric-card">
<h3>Profitability</h3>
<p id="profitability">--</p>
</div>

<div class="metric-card">
<h3>Cash Flow</h3>
<p id="cashflow">--</p>
</div>

</div>

</section>

<script src="css/js/fundamental.js"></script>

</body>
</html>
