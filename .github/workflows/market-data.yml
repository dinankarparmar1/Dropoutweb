name: Update market data

on:
  schedule:
    # 13:00 UTC = 18:30 IST, Mon-Fri — after NSE close and after FII/DII
    # + insider filings are usually published for the day.
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FII/DII, insider trading, and market breadth data
        run: python3 scripts/fetch_market_data.py --debug

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update market data $(date -u +'%Y-%m-%d')"
          git push

