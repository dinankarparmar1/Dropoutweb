name: Update market data

on:
  schedule:
    # NSE trading hours are 09:15-15:30 IST = 03:45-10:00 UTC. GitHub's
    # scheduler is best-effort and can run a few minutes late under load,
    # so "every 15 min" here means "at least every 15 min", not to-the-
    # second -- that's a GitHub Actions platform limitation, not something
    # a workflow can force tighter.
    # Minutes are kept off :00/:15/:30/:45 -- GitHub's busiest moments,
    # when scheduled runs get delayed or dropped (most runs were landing
    # hours late, after market close).
    - cron: '52 3 * * 1-5'          # 09:22 IST -- just after market open
    - cron: '7,22,37,52 4-9 * * 1-5'  # 09:37 IST through 15:22 IST, every 15 min
    - cron: '7 10 * * 1-5'          # 15:37 IST -- just after market close
    # 13:07 UTC = 18:37 IST -- after NSE close and after FII/DII + insider
    # filings are usually published for the day (those two don't need the
    # 15-min cadence, only the heatmap does, but re-running everything is
    # simpler than splitting into two workflows).
    - cron: '7 13 * * 1-5'          # 18:37 IST
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FII/DII, insider trading, market breadth, and heatmap data
        run: python3 scripts/fetch_market_data.py --debug

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update market data $(date -u +'%Y-%m-%d')"
          git push

