<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dropout Traders Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

--bg:#07070a;
--bg-alt:#0c0c11;
--bg-raise:#111116;

--panel:rgba(255,255,255,.035);
--panel-strong:rgba(255,255,255,.06);

--panel-border:rgba(212,175,55,.22);

--gold:#d4af37;
--gold-light:#f3d576;

--text:#f6f4ee;
--muted:#a8a49b;

--green:#4a9a76;
--red:#b1594a;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
radial-gradient(circle at top,#18140d 0%,#07070a 60%);

color:var(--text);

min-height:100vh;

}

.header{

position:sticky;

top:0;

z-index:1000;

display:flex;

justify-content:space-between;

align-items:center;

padding:22px 40px;

background:rgba(7,7,10,.92);

backdrop-filter:blur(20px);

border-bottom:1px solid var(--panel-border);

}

.brand{

display:flex;

align-items:center;

gap:18px;

}

.brand h1{

font-size:30px;

color:var(--gold);

}

.brand p{

color:var(--muted);

font-size:14px;

margin-top:4px;

}

.logout{

padding:13px 22px;

background:#9b2c2c;

border:none;

border-radius:14px;

color:white;

font-weight:700;

cursor:pointer;

transition:.25s;

}

.logout:hover{

transform:translateY(-2px);

}

.wrapper{

width:min(1450px,94%);

margin:40px auto;

}

.stats{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:30px;

}

.stat{

background:var(--panel);

border:1px solid var(--panel-border);

backdrop-filter:blur(18px);

border-radius:22px;

padding:26px;

}

.stat h4{

color:var(--muted);

font-size:14px;

}

.stat h2{

margin-top:10px;

font-size:34px;

color:var(--gold);

}

.main{

display:grid;

grid-template-columns:2fr 1fr;

gap:28px;

}

.card{

background:var(--panel);

border:1px solid var(--panel-border);

border-radius:24px;

padding:28px;

backdrop-filter:blur(18px);

}

.card-title{

font-size:24px;

margin-bottom:25px;

color:var(--gold);

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

.field{

margin-bottom:18px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

color:var(--muted);

}

input,
select,
textarea{

width:100%;

padding:15px;

border-radius:16px;

background:#111116;

border:1px solid rgba(212,175,55,.15);

color:white;

font-size:15px;

outline:none;

transition:.25s;

}

input:focus,
select:focus,
textarea:focus{

border-color:var(--gold);

box-shadow:0 0 18px rgba(212,175,55,.15);

}

textarea{

height:180px;

resize:none;

}

.publish{

margin-top:25px;

width:100%;

padding:18px;

border:none;

border-radius:16px;

font-size:17px;

font-weight:700;

cursor:pointer;

background:linear-gradient(135deg,var(--gold),var(--gold-light));

color:#111;

transition:.25s;

}

.publish:hover{

transform:translateY(-2px);

box-shadow:0 0 28px rgba(212,175,55,.25);

}

.preview{

text-align:center;

}

.preview img{

width:100%;

display:none;

border-radius:18px;

margin-bottom:20px;

}

.badge{

display:inline-block;

padding:8px 20px;

border-radius:999px;

background:var(--green);

font-weight:700;

margin-bottom:18px;

}

.preview h2{

margin-bottom:10px;

color:var(--gold);

}

.preview p{

color:var(--muted);

line-height:1.7;

}

@media(max-width:1000px){

.stats{

grid-template-columns:1fr 1fr;

}

.main{

grid-template-columns:1fr;

}

}

@media(max-width:700px){

.stats,
.grid{

grid-template-columns:1fr;

}

.header{

padding:18px;

}

}

</style>

</head>

<body>

<header class="header">

<div class="brand">

<div>

<h1>Dropout Traders Admin</h1>

<p>Institutional Research Publishing Platform</p>

</div>

</div>

<button id="logout" class="logout">
Logout
</button>

</header>

<div class="wrapper">

<div class="stats">

<div class="stat">
<h4>Total Posts</h4>
<h2 id="totalPosts">0</h2>
</div>

<div class="stat">
<h4>Total Views</h4>
<h2>0</h2>
</div>

<div class="stat">
<h4>Buy Calls</h4>
<h2>0</h2>
</div>

<div class="stat">
<h4>Success Rate</h4>
<h2>0%</h2>
</div>

</div>

<div class="main">

<div class="card">

<h2 class="card-title">Publish Daily Analysis</h2>

<div class="grid">

<div class="field">
<label>Stock Name</label>
<input id="stock">
</div>

<div class="field">
<label>Analysis Title</label>
<input id="title">
</div>

<div class="field">
<label>Signal</label>

<select id="signal">
<option>BUY</option>
<option>SELL</option>
<option>HOLD</option>
</select>

</div>

<div class="field">
<label>Entry Price</label>
<input id="entry">
</div>

<div class="field">
<label>Target</label>
<input id="target">
</div>

<div class="field">
<label>Stop Loss</label>
<input id="stoploss">
</div>

</div>

<div class="field">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="field">
<label>Upload Analysis Image</label>
<input id="image" type="file" accept="image/*">
</div>

<button class="publish">
🚀 Publish Analysis
</button>

</div>

<div class="card preview">

<h2 class="card-title">Live Preview</h2>

<div class="badge" id="previewSignal">
BUY
</div>

<img id="preview">

<h2 id="previewStock">
Stock Name
</h2>

<p id="previewTitle">
Analysis title will appear here...
</p>
