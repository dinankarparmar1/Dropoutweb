<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — TraderOS — Dropout Traders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08;
    --panel:rgba(255,248,235,0.025);
    --panel-hi:rgba(255,248,235,0.045);
    --line:rgba(224,197,138,0.14);
    --brass:#c9a227;
    --brass-bright:#ecc766;
    --ink:#f2ede1;
    --sub-dim:#5f5a4d;
    --terracotta:#c17a5f;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(ellipse 800px 500px at 20% -5%, rgba(201,162,39,0.08), transparent 60%),
      var(--bg);
  }
  .card{
    width:100%;max-width:400px;
    border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(160deg, var(--panel-hi), var(--panel));
    padding:38px 34px;
  }
  .brand{
    font-family:var(--serif);font-weight:600;font-size:19px;
    display:flex;align-items:baseline;gap:8px;justify-content:center;margin-bottom:6px;
  }
  .brand .thin{color:var(--sub-dim);font-weight:500;font-size:14px;}
  .brand .rule{width:24px;height:1px;background:var(--brass);display:inline-block;}
  .subtitle{
    text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--sub-dim);
    letter-spacing:0.14em;text-transform:uppercase;margin-bottom:30px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-family:var(--mono);font-size:9.5px;color:var(--sub-dim);
    letter-spacing:0.08em;text-transform:uppercase;margin-bottom:7px;
  }
  .field input{
    width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:var(--sans);font-size:14px;padding:11px 13px;
  }
  .field input:focus{outline:none;border-color:var(--brass);}
  .btn-submit{
    width:100%;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:0.06em;
    text-transform:uppercase;background:var(--brass);border:none;color:#0b0a08;
    padding:13px;border-radius:20px;cursor:pointer;margin-top:8px;transition:background .2s ease;
  }
  .btn-submit:hover{background:var(--brass-bright);}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed;}
  .error-box{
    color:var(--terracotta);font-family:var(--mono);font-size:11.5px;
    margin-bottom:14px;min-height:14px;line-height:1.5;
  }
  .success-box{
    color:#5da583;font-family:var(--mono);font-size:11.5px;
    margin-bottom:14px;line-height:1.5;
  }
  .link-back{
    display:block;text-align:center;margin-top:18px;
    font-family:var(--mono);font-size:11px;color:var(--sub-dim);text-decoration:underline;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">Trader<span class="rule"></span><span class="thin">OS</span></div>
  <div class="subtitle">Set a new password</div>

  <div class="error-box" id="errorBox"></div>
  <div class="success-box" id="successBox"></div>

  <form id="resetForm">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="fPassword" placeholder="••••••••" required minlength="6">
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" id="fPassword2" placeholder="••••••••" required minlength="6">
    </div>
    <button type="submit" class="btn-submit" id="btnSubmit">Set New Password</button>
  </form>

  <a href="auth.html" class="link-back">← Back to Sign In</a>
</div>

<script>
const WORKER_URL = 'https://ivaan.dinankarparmar12345.workers.dev';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const errorBox = document.getElementById('errorBox');
const successBox = document.getElementById('successBox');
const form = document.getElementById('resetForm');
const btnSubmit = document.getElementById('btnSubmit');

if (!token) {
  errorBox.textContent = 'This link is missing its reset token — request a new one from the sign-in page.';
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';
  successBox.textContent = '';

  const password = document.getElementById('fPassword').value;
  const password2 = document.getElementById('fPassword2').value;

  if (password !== password2) {
    errorBox.textContent = "Passwords don't match.";
    return;
  }
  if (password.length < 6) {
    errorBox.textContent = 'Password must be at least 6 characters.';
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.textContent = 'Saving...';

  try {
    const res = await fetch(`${WORKER_URL}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      errorBox.textContent = data.error || 'Something went wrong — try again.';
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Set New Password';
    } else {
      successBox.textContent = 'Password updated — redirecting to sign in...';
      form.style.display = 'none';
      setTimeout(() => { window.location.href = 'auth.html'; }, 1800);
    }
  } catch {
    errorBox.textContent = 'Network error — try again.';
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Set New Password';
  }
});
</script>
</body>
</html>
